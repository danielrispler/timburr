name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Write env file and keystore from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          jq -n --arg url "$SUPABASE_URL" --arg key "$SUPABASE_PUBLISHABLE_KEY" \
            '{SUPABASE_URL: $url, SUPABASE_PUBLISHABLE_KEY: $key}' > .env.json
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build signed APK
        env:
          TIMBURR_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          TIMBURR_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TIMBURR_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TIMBURR_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter build apk --release --dart-define-from-file=.env.json \
            --build-number=${{ github.run_number }} --build-name=${GITHUB_REF_NAME#v}
          mv build/app/outputs/flutter-apk/app-release.apk "timburr-${GITHUB_REF_NAME}.apk"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "timburr-${GITHUB_REF_NAME}.apk" --title "$GITHUB_REF_NAME" --generate-notes

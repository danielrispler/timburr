name: timburr
description: "Personal offline-first workout log."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  connectivity_plus: ^7.3.2
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  file_picker: ^13.2.0
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  google_mlkit_text_recognition: ^0.17.1
  image_picker: ^1.2.4
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  supabase_flutter: ^2.18.3
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  assets:
    - assets/exercises.json
  fonts:
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/GoogleSans-400.ttf
        - asset: assets/fonts/GoogleSans-500.ttf
          weight: 500
